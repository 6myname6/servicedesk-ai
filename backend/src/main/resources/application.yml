server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: servicedesk-ai
  profiles:
    active: dev
  servlet:
    multipart:
      # 单文件上限取两类业务的较大值（知识库文档 20MB），工单附件 10MB 由业务层再校验
      max-file-size: 20MB
      # 请求体略大于单文件上限，留出表单字段开销
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://localhost:3306/servicedesk_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:servicedesk-ai-dev-only-secret-key-0123456789abcdef}
  expire-seconds: 604800

# 附件存储：阿里云 OSS。缺任一项时上传/删除返回 503，不影响其他接口启动。
# 本地演示若暂无 OSS 账号，可留空，用单测的 mock 覆盖存储分支。
storage:
  oss:
    # 例：oss-cn-hangzhou.aliyuncs.com（可带 https:// 前缀）
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:servicedesk-ai}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # 可选：CDN 或自定义域名；为空时按 https://{bucket}.{endpoint}/{key} 拼公网地址
    public-url-prefix: ${OSS_PUBLIC_URL_PREFIX:}

app:
  client-ip:
    # 是否信任 X-Forwarded-For 里的客户端地址。
    # 仅当应用部署在可信反向代理（Nginx 等）之后才可开启；直连部署时开启，
    # 攻击者可伪造该请求头，每次换一个伪造 IP 即可绕过 IP 维度限流。
    trust-proxy: ${TRUST_PROXY:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  packages-to-scan: com.servicedesk.controller

logging:
  level:
    com.servicedesk: INFO
