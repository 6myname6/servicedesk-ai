# =============================================================
# 智维工单 · 本机 nginx 主配置（Windows / 项目内自包含运行时）
#
# 运行方式（不要直接双击 nginx.exe）：
#   powershell -ExecutionPolicy Bypass -File deploy\start-nginx.ps1
#
# 约定：
#   - 前缀目录 = deploy\nginx\，本文件会被 start-nginx.ps1 复制到
#     deploy\nginx\conf\nginx.conf 后启动；
#   - root 用相对路径 html/servicedesk-ai，相对前缀目录解析；
#   - 后端需运行在 127.0.0.1:8080 且 context-path=/api。
# =============================================================

worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # 上传上限略大于后端 multipart.max-request-size（25MB）
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        root   html/servicedesk-ai;
        index  index.html;
        charset utf-8;

        # 接口：proxy_pass 不带 URI，保留 /api 前缀原样转发
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 登录限流按客户端 IP：要让后端识别真实 IP，还需后端 TRUST_PROXY=true
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # 带内容哈希的静态资源长期缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 不缓存，发版后能立刻拿到新的资源引用
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # 前端是 history 路由，刷新子路径要回落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
